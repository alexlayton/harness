# Import explicitly; this is an OpenShell provider profile, not Harness config.
# Only the Harness binary can use the declared inference endpoint.
id: harness-openrouter
display_name: Harness OpenRouter
description: OpenRouter inference access for the Harness container image
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/harness]
