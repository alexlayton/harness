[package]
name = "tui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ignore = "0.4"
ratatui = "0.29"
ratatui-core = "0.1"
tui-markdown = "0.3"
tui-textarea = "0.7"
unicode-width = "0.2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
textwrap = "0.16"
proptest = "1"
