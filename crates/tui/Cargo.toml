[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ignore = "0.4"
ratatui = "0.29"
textwrap = "0.16"
tui-markdown = "0.3"
tui-textarea = "0.7"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
