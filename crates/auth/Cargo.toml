[package]
name = "auth"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GitHub Copilot authentication and private credential storage for Harness"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
# The `ring` crypto provider must be installed before any reqwest client is
# built (see crates/llm — the same provider install covers this crate). Kept
# as a direct dependency so the feature intent is explicit here too.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
