[package]
name = "mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
# Bounded Streamable HTTP client (see src/http_client.rs); both crates are
# already in the graph through rmcp/reqwest.
bytes = "1"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-stream = "0.2.4"
thiserror = "2"
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
url = "2"
tools.workspace = true
llm.workspace = true

[target.'cfg(unix)'.dependencies]
# Process-group signals for stdio MCP servers and their descendants.
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["net"] }
