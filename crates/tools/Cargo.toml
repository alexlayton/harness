[package]
name = "tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
diff = "0.1"
fff-search = { version = "0.10.3", default-features = false, features = ["ripgrep"] }
ignore = "0.4"
llm.workspace = true
monty = "=1.0.0-beta.2"
monty-types = "=1.0.0-beta.2"
serde_json = "1"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Directory-handle-relative path resolution (`openat`/`O_NOFOLLOW`) for the
# TOCTOU-safe open path in `vfs.rs`. No new dependency on other platforms.
rustix = { version = "1.1", features = ["fs", "process"] }
# Process-group signalling (`killpg`-equivalent) for bash tree teardown.
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
