[package]
name = "tools"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
diff = "0.1"
fff-search = { version = "0.10.3", default-features = false, features = ["ripgrep"] }
llm = { path = "../llm" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
