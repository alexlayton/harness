[workspace]
resolver = "3"
members = ["crates/agent", "crates/auth", "crates/compact", "crates/harness", "crates/llm", "crates/mcp", "crates/session", "crates/tui", "crates/tools"]
default-members = ["crates/harness", "crates/agent"]

# Release ships lean: symbol tables stripped, cross-crate DCE via fat LTO,
# one codegen unit for inlining, and abort-on-panic to drop unwind tables.
# These slow release builds by design — never mirror them in `[profile.dev]`.
# `panic = "abort"` is the only entry with semantic consequences: Drop
# handlers no longer run on panic and a panicking tokio worker kills the
# process instead of just its task. The TUI panic hook still restores the
# terminal before the abort.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

# Source package managers still produce an optimized, stripped binary, but
# avoid the fat-LTO/single-codegen-unit cost paid by official artifacts.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

# Debug builds keep backtraces usable while shrinking the binary and target/
# dramatically — full DWARF is most of the ~80 MB dev artifact and dominates
# link time.
[profile.dev]
debug = "line-tables-only"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
agent = { path = "crates/agent" }
auth = { path = "crates/auth" }
compact = { path = "crates/compact" }
llm = { path = "crates/llm" }
mcp = { path = "crates/mcp" }
session = { path = "crates/session" }
tools = { path = "crates/tools" }
tui = { path = "crates/tui" }
# The exact tokio feature set the harness binary needs — `full` used to pull in
# `net` (unused) and bloated the feature union. Library crates keep their own
# precise declarations.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "io-util",
] }