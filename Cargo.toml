[workspace]
resolver = "3"
members = ["crates/agent", "crates/auth", "crates/compact", "crates/harness", "crates/llm", "crates/mcp", "crates/python", "crates/session", "crates/tui", "crates/tui-md", "crates/tools"]
default-members = ["crates/harness", "crates/agent"]

# Release ships lean: symbol tables are stripped, with cross-crate DCE via fat
# LTO and one codegen unit for inlining. These slow release builds by design —
# never mirror them in `[profile.dev]`. Keep unwind semantics so terminal
# guards can restore their modes after a panic.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "unwind"

# Source package managers still produce an optimized, stripped binary, but
# avoid the fat-LTO/single-codegen-unit cost paid by official artifacts.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

# Debug builds keep backtraces usable while shrinking the binary and target/
# dramatically — full DWARF is most of the ~80 MB dev artifact and dominates
# link time.
[profile.dev]
debug = "line-tables-only"

# tui-md highlights code with syntect/fancy-regex, which are pathologically
# slow unoptimised; keep them fast in dev builds and tests. Profile settings
# only apply from the workspace root.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3

[workspace.package]
version = "0.11.0"
edition = "2024"
publish = false

[workspace.dependencies]
agent = { path = "crates/agent" }
auth = { path = "crates/auth" }
compact = { path = "crates/compact" }
llm = { path = "crates/llm" }
mcp = { path = "crates/mcp" }
session = { path = "crates/session" }
tools = { path = "crates/tools" }
tui = { path = "crates/tui" }
tui-md = { path = "crates/tui-md" }
# The exact tokio feature set the harness binary needs — `full` used to pull in
# `net` (unused) and bloated the feature union. Library crates keep their own
# precise declarations.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "io-util",
    "process",
] }