name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent") | .version')"
          tag="v${version}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" != "$tag" ]]; then
            echo "Tag ${{ github.ref_name }} does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-checks-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace
      - run: cargo test --workspace
      - run: cargo build --workspace

  artifacts:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: harness-${{ needs.checks.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: harness-${{ needs.checks.outputs.tag }}-aarch64-apple-darwin.tar.gz
            # This can be a cross-build on an Intel runner.
            smoke: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: harness-${{ needs.checks.outputs.tag }}-x86_64-apple-darwin.tar.gz
            smoke: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin harness
      - name: Smoke test executable
        if: matrix.smoke
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/harness"
          "$binary" --help >/dev/null
          test "$("$binary" --version)" = "harness ${{ needs.checks.outputs.version }}"
      - name: Package archive
        shell: bash
        run: |
          package="harness-${{ needs.checks.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/harness" README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${{ matrix.archive }}" "$package"
          tar -tzf "dist/${{ matrix.archive }}" | grep -Fx "$package/harness"
          tar -tzf "dist/${{ matrix.archive }}" | grep -Fx "$package/README.md"
          tar -tzf "dist/${{ matrix.archive }}" | grep -Fx "$package/LICENSE"
          rm -rf "dist/$package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [checks, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum harness-* > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.checks.outputs.tag }}
          VERSION: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          args=("$TAG" dist/* --draft --generate-notes --title "Harness $VERSION")
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"
