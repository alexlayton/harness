name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent") | .version')"
          tag="v${version}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" != "$tag" ]]; then
            echo "Tag ${{ github.ref_name }} does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-checks-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace
      - run: cargo test --workspace
      - run: cargo build --workspace

  artifacts:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: harness-${{ needs.checks.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: harness-${{ needs.checks.outputs.tag }}-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: harness-${{ needs.checks.outputs.tag }}-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: harness-${{ needs.checks.outputs.tag }}-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin harness
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="harness-${{ needs.checks.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/harness" README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${{ matrix.archive }}" "$package"
          rm -rf "dist/$package"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "harness-${{ needs.checks.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$package"
          Copy-Item "target/${{ matrix.target }}/release/harness.exe", README.md, LICENSE -Destination "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/${{ matrix.archive }}"
          Remove-Item -Recurse "dist/$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [checks, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum harness-* > SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.checks.outputs.tag }}
          VERSION: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          args=("$TAG" dist/* --draft --generate-notes --title "Harness $VERSION")
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${args[@]}"
