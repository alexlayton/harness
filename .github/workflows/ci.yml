name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (Linux)
    # Pinned to the release baseline (Ubuntu 22.04 / glibc 2.35) so CI
    # validates the same runtime the GNU artifact ships on. Do not move
    # this to ubuntu-latest without intentionally changing that baseline.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: cargo test --workspace --locked

  build:
    name: Build (Linux)
    # Same pinned baseline as Test (Linux) above; see that comment.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - run: cargo build --workspace --locked

  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      # Reuse registry builds when maturin compiles the extracted source archive.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-python-${{ matrix.python }}-${{ hashFiles('Cargo.lock', 'python/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-python-${{ matrix.python }}-
      - name: Install uv
        run: python -m pip install uv
      - name: Build source distribution
        run: uv build --sdist --out-dir dist/python ./python
      - name: Install from source archive
        run: |
          uv venv --python python .venv
          uv pip install --python .venv/bin/python dist/python/*.tar.gz
      - name: Verify installed version and license
        shell: bash
        run: |
          expected="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "harness-python") | .version')"
          .venv/bin/python - "$expected" <<'PY'
          from importlib.metadata import distribution
          import sys
          import harness

          package = distribution("harness-agent")
          assert package.version == sys.argv[1], (package.version, sys.argv[1])
          licenses = [p for p in package.files if ".dist-info/licenses/" in str(p)]
          assert any("MIT License" in package.locate_file(p).read_text() for p in licenses)
          assert callable(harness.run)
          PY
      - name: Test Python API without model requests
        run: .venv/bin/python -m unittest discover -s python/tests -v

  macos-test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-platform-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-platform-test-
      - run: cargo test --workspace --locked
